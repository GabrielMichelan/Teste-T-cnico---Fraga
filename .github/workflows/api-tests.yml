name: API tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Parte 3/cypress

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Parte 3/cypress/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API suite
        run: npx cypress run --spec "api/**/*.cy.ts" --reporter junit --reporter-options "mochaFile=results/api-[hash].xml,toConsole=true"

      - name: Publish API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: Parte 3/cypress/results/*.xml
          if-no-files-found: warn
          retention-days: 30
